services:
  author:
    image: tomcat:9.0.106-jdk21-temurin
    container_name: magnolia-author
    ports:
      - "8080:8080"
    environment:
      CATALINA_OPTS: >-
        -Xms1024m -Xmx3072m
        -Djava.awt.headless=true
        -Dmagnolia.update.auto=true
        -Dmagnolia.develop=true
        -Dmagnolia.resources.dir=/magnolia/light-modules
        -Dmagnolia.repositories.home=/magnolia/data/repositories
        -Dmagnolia.cookie.csrf.secure=false
    entrypoint: ["/bin/sh", "/docker/entrypoint.sh"]
    volumes:
      - type: bind
        source: ${MAGNOLIA_WAR_PATH:-./bundle/ROOT.war}
        target: /bundle/ROOT.war
        read_only: true
        bind:
          create_host_path: false
      - ./docker/entrypoint.sh:/docker/entrypoint.sh:ro
      - type: bind
        source: ${LM_REPO_DIR:-./light-modules}
        target: /magnolia/light-modules
        bind:
          create_host_path: false
      - type: bind
        source: ${MAGNOLIA_DATA_DIR:-./data}
        target: /magnolia/data
        bind:
          create_host_path: false
    restart: unless-stopped

  lm-dev:
    image: node:20-alpine
    container_name: magnolia-lm-dev
    working_dir: /workspace/sanofi-lm-dupixent
    command: sh -lc "npm run start"
    volumes:
      - type: bind
        source: ${LM_REPO_DIR:-./light-modules}
        target: /workspace
        bind:
          create_host_path: false
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    restart: unless-stopped
